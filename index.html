<script>
(function () {
  var DUR = 30;
  var audio = document.getElementById('audio');
  var prog = document.getElementById('prog');
  var time = document.getElementById('time');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.js-play'));
  var player = document.querySelector('.player');
  var playing = false;

  function setGlyph(on) {
    buttons.forEach(function (b) {
      b.querySelector('.ico-play').style.display = on ? 'none' : '';
      b.querySelector('.ico-pause').style.display = on ? '' : 'none';
    });
  }
  function render(t) {
    t = Math.min(t, DUR);
    prog.style.width = (t / DUR * 100) + '%';
    var s = Math.floor(DUR - t);
    time.textContent = '0:' + (s < 10 ? '0' + s : s);
  }
  function stop() {
    try { audio.pause(); audio.currentTime = 0; } catch (e) {}
    playing = false; setGlyph(false); render(0);
  }
  function toggle() {
    if (playing) { audio.pause(); playing = false; setGlyph(false); return; }
    playing = true; setGlyph(true);
    var p = audio.play(); if (p && p.catch) p.catch(function () { playing = false; setGlyph(false); });
  }

  audio.addEventListener('timeupdate', function () {
    render(audio.currentTime);
    if (audio.currentTime >= DUR) stop();
  });
  audio.addEventListener('ended', stop);
  buttons.forEach(function (b) { b.addEventListener('click', toggle); });

  var hasPreview = false;
  fetch('preview.mp3', { method: 'HEAD' }).then(function (r) {
    if (r.ok) { hasPreview = true; buttons[0].hidden = false; player.hidden = false; }
  }).catch(function () {});

  var ym = document.getElementById('ym');
  var ymState = 'idle';
  function ymSend(type) { try { ym.contentWindow.postMessage({ source: 'EXTERNAL_PLAYER', type: type }, 'https://music.yandex.ru'); } catch (e) {} }
  function startYandex() {
    if (ymState === 'idle') { ymSend('PLAY_SOURCE'); ymState = 'playing'; }
    else if (ymState === 'playing') { ymSend('PAUSE'); ymState = 'paused'; }
    else { ymSend('RESUME'); ymState = 'playing'; }
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://music.yandex.ru' || !e.data) return;
    var st = e.data.status || (e.data.payload && e.data.payload.status);
    if (st === 'PLAYING' || st === 'LOADING') ymState = 'playing';
    else if (st === 'PAUSED' || st === 'STOPPED' || st === 'ENDED') ymState = 'paused';
    else if (st === 'IDLE' || e.data.type === 'ERROR') ymState = 'idle';
  });
  var downX = 0, downY = 0;
  document.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; }, { passive: true });
  document.addEventListener('pointerup', function (e) {
    if (Math.abs(e.clientX - downX) > 12 || Math.abs(e.clientY - downY) > 12) return;
    if (e.target.closest('a, button, #yandex-widget, .player, iframe')) return;
    if (hasPreview) { toggle(); return; }
    startYandex();
  });
})();
</script>
